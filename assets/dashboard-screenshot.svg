<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Subscription Hub dashboard</title>
<desc id="desc">Dashboard preview showing configuration statistics, subscription link, settings and server groups.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f7fb"/><stop offset="1" stop-color="#e9eef6"/></linearGradient>
  <linearGradient id="brand" x2="1" y2="1"><stop stop-color="#315be8"/><stop offset="1" stop-color="#6c49d8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#1d2a44" flood-opacity=".09"/></filter>
  <style>
    .ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
    .muted{fill:#788399}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.head{font-size:23px;font-weight:700}.cardtitle{font-size:19px;font-weight:700}
  </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect x="34" y="30" width="1532" height="940" rx="25" fill="#fff" filter="url(#shadow)"/>
